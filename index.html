<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vape Shop | Yellow & Black</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ===== ЖЕЛТО-ЧЕРНАЯ ПАЛИТРА ===== */
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --hint-color: #888888;
            --accent-color: #ffcc00; /* Яркий желтый */
            --button-text: #000000;
            --card-bg: #1a1a1a;
            --glass-bg: rgba(20, 20, 20, 0.95);
            --border-color: #333333;
            --success-color: #00ff88;
            --danger-color: #ff4444;
        }

        /* Светлая тема (если включена в Telegram) */
        body.tg-light {
            --bg-color: #f4f4f4;
            --text-color: #000000;
            --hint-color: #666666;
            --accent-color: #ffaa00;
            --button-text: #000000;
            --card-bg: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e0e0e0;
        }

        body {
            margin: 0; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            padding-bottom: 200px;
            transition: background-color 0.3s, color 0.3s;
        }

        h1 { 
            font-size: 26px; margin-bottom: 16px; text-align: center; 
            font-weight: 900; color: var(--accent-color); 
            text-transform: uppercase; letter-spacing: 1px; 
        }

        /* Блок акций */
        .promo-banner {
            background: linear-gradient(90deg, var(--accent-color), #ff8800);
            color: #000; padding: 12px 16px; border-radius: 12px;
            margin-bottom: 16px; font-weight: bold; text-align: center; font-size: 14px;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.2);
        }

        /* Поиск */
        .search-bar { margin-bottom: 16px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .search-bar input {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--card-bg);
            color: var(--text-color); font-size: 15px; box-sizing: border-box; outline: none;
        }
        .search-bar input:focus { border-color: var(--accent-color); }

        /* Категории */
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; max-width: 600px; margin-left: auto; margin-right: auto; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .category-btn {
            background: var(--card-bg); color: var(--text-color);
            border: 1px solid var(--border-color); padding: 8px 16px;
            border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap;
            transition: all 0.2s;
        }
        .category-btn.active { background: var(--accent-color); color: var(--button-text); border-color: var(--accent-color); font-weight: bold; }

        /* Сетка товаров */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }

        .product-card {
            background: var(--card-bg); border-radius: 16px; padding: 12px;
            display: flex; flex-direction: column; border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }
        .product-card:active { transform: scale(0.98); }

        .product-image { width: 100%; height: 140px; background: #fff; border-radius: 12px; margin-bottom: 12px; object-fit: contain; }
        .product-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; line-height: 1.3; }
        .product-price { font-size: 18px; font-weight: 800; color: var(--accent-color); margin-bottom: 8px; }
        .stock-status { font-size: 12px; margin-bottom: 12px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .stock-in { color: var(--success-color); }
        .stock-out { color: var(--danger-color); }

        .add-btn {
            background: var(--accent-color); color: var(--button-text);
            border: none; padding: 12px; border-radius: 10px; font-weight: 700;
            font-size: 14px; cursor: pointer; margin-top: auto;
            transition: opacity 0.2s;
        }
        .add-btn:active { opacity: 0.8; }
        .add-btn:disabled { background: var(--border-color); color: var(--hint-color); }

        /* Нижняя панель (Корзина) */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 16px; display: flex; flex-direction: column; gap: 12px;
            border-top: 1px solid var(--border-color);
            max-width: 800px; margin: 0 auto; z-index: 100;
        }

        .cart-info { display: flex; justify-content: space-between; align-items: center; }

        .promo-section { display: flex; gap: 8px; }
        .promo-section input {
            flex: 1; padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--card-bg);
            color: var(--text-color); font-size: 14px; outline: none; text-transform: uppercase;
        }
        .promo-section button {
            background: var(--card-bg); color: var(--accent-color);
            border: 1px solid var(--accent-color); padding: 10px 16px;
            border-radius: 10px; font-weight: 600; cursor: pointer;
        }

        .checkout-btn {
            background: var(--accent-color); color: var(--button-text);
            border: none; padding: 14px; border-radius: 12px;
            font-weight: 800; font-size: 16px; cursor: pointer; width: 100%;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }
        .checkout-btn:active { opacity: 0.8; }

        /* Модальное окно (Выбор количества) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 24px; box-sizing: border-box; border-top: 2px solid var(--accent-color); }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 16px; text-align: center; }
        .quantity-control { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 24px; }
        .qty-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 24px; cursor: pointer; }
        .qty-display { font-size: 24px; font-weight: bold; min-width: 40px; text-align: center; }
        .modal-add-btn { width: 100%; background: var(--accent-color); color: var(--button-text); border: none; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Vape Shop</h1>
    
    <!-- БАННЕР АКЦИИ (Можете менять текст) -->
    <div class="promo-banner" id="banner-text">
        🔥 АКЦИЯ: Скидка 10% по промокоду VAPE10!
    </div>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Поиск товаров...">
    </div>

    <div class="categories" id="categories">
        <button class="category-btn active" data-category="all">Все</button>
        <button class="category-btn" data-category="pods">Под-системы</button>
        <button class="category-btn" data-category="liquids">Жидкости</button>
        <button class="category-btn" data-category="coils">Испарители</button>
    </div>

    <div class="product-grid" id="product-grid"></div>

    <!-- ПАНЕЛЬ КОРЗИНЫ -->
    <div class="cart-bar">
        <div class="cart-info">
            <div>
                <div style="font-size: 12px; color: var(--hint-color); margin-bottom: 4px;">Итого:</div>
                <div id="cart-total" style="font-weight: 800; font-size: 20px;">0 ₽</div>
            </div>
            <div id="discount-info" style="color: var(--success-color); font-weight: bold; font-size: 14px;"></div>
        </div>
        
        <div class="promo-section">
            <input type="text" id="promo-input" placeholder="ПРОМОКОД">
            <button onclick="applyPromo()">Применить</button>
        </div>

        <button class="checkout-btn" onclick="checkout()">Оплатить</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА КОЛИЧЕСТВА -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-product-title">Товар</div>
            <div class="quantity-control">
                <button class="qty-btn" onclick="changeQty(-1)">−</button>
                <div class="qty-display" id="modal-qty">1</div>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="modal-add-btn" onclick="confirmAdd()">Добавить в корзину</button>
        </div>
    </div>

    <script>
        // ==============================================================
        // ⚠️ БЛОК НАСТРОЕК: ЗДЕСЬ ВЫ МЕНЯЕТЕ ТОВАРЫ, ЦЕНЫ И НАЛИЧИЕ ⚠️
        // ==============================================================
        const products = [
            { 
                id: 1,                              // ID (просто номер, не повторяйте)
                title: "Под-система XROS 3",        // Название
                price: 2500,                        // Цена (только цифры)
                inStock: true,                      // true = Есть, false = Нет
                category: 'pods',                   // Категория (pods, liquids, coils)
                image: "https://vapezone.com.ua/wp-content/uploads/2023/02/xros-3.jpg" // Ссылка на фото
            },
            { 
                id: 2, 
                title: "Жидкость Blueberry Ice", 
                price: 800, 
                inStock: true, 
                category: 'liquids', 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Vape_liquid_bottle.jpg/800px-Vape_liquid_bottle.jpg" 
            },
            { 
                id: 3, 
                title: "Испаритель 0.6 Ohm", 
                price: 350, 
                inStock: false, 
                category: 'coils', 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Coil_for_e-cigarette.jpg/640px-Coil_for_e-cigarette.jpg" 
            },
            { 
                id: 4, 
                title: "Одноразка Elf Bar", 
                price: 1200, 
                inStock: true, 
                category: 'pods', 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Elf_bar_vape.jpg/640px-Elf_bar_vape.jpg" 
            },
            { 
                id: 5, 
                title: "Жидкость Mango Tango", 
                price: 750, 
                inStock: true, 
                category: 'liquids', 
                image: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Vape_liquid_bottle.jpg/800px-Vape_liquid_bottle.jpg" 
            },
            { 
                id: 6, 
                title: "Smoant Pasito 3", 
                price: 3000, 
                inStock: true, 
                category: 'pods', 
                image: "iwebp"
            }
        ];

        // ==============================================================
        // ⚠️ БЛОК НАСТРОЕК: ЗДЕСЬ ВЫ МЕНЯЕТЕ ПРОМОКОДЫ ⚠️
        // ==============================================================
        const promoCodes = { 
            "VAPE10": 0.10,  // Промокод VAPE10 дает скидку 10% (0.10)
            "SMOKE20": 0.20  // Промокод SMOKE20 дает скидку 20% (0.20)
        };

        // ==============================================================
        // НИЖЕ КОД, КОТОРЫЙ ЛУЧШЕ НЕ ТРОГАТЬ (Логика работы)
        // ==============================================================
        let cart = {};
        let currentCategory = 'all';
        let searchQuery = '';
        let activeDiscount = 0;
        let activePromoCode = '';

        let tg;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready(); tg.expand();
            if (tg.colorScheme === 'light') document.body.classList.add('tg-light');
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const filtered = products.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--hint-color); padding: 20px;">Ничего не найдено</div>';
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" class="product-image" alt="${product.title}" onerror="this.src='https://via.placeholder.com/150x150/333/fff?text=No+Photo'">
                    <div class="product-title">${product.title}</div>
                    <div class="product-price">${product.price} ₽</div>
                    <div class="stock-status ${product.inStock ? 'stock-in' : 'stock-out'}">
                        ${product.inStock ? 'В наличии' : 'Нет в наличии'}
                    </div>
                    <button class="add-btn" onclick="openModal(${product.id})" ${!product.inStock ? 'disabled' : ''}>
                        ${product.inStock ? 'Купить' : 'Нет'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => { searchQuery = e.target.value; renderProducts(); });

        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderProducts();
            });
        });

        let currentProductId = null; let currentQty = 1;
        function openModal(id) {
            currentProductId = id; currentQty = 1;
            const product = products.find(p => p.id === id);
            document.getElementById('modal-product-title').innerText = product.title;
            document.getElementById('modal-qty').innerText = currentQty;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function changeQty(change) { if (currentQty + change >= 1) { currentQty += change; document.getElementById('modal-qty').innerText = currentQty; } }
        
        function confirmAdd() {
            if (cart[currentProductId]) cart[currentProductId] += currentQty;
            else cart[currentProductId] = currentQty;
            updateCartUI(); closeModal();
            if (tg) tg.HapticFeedback.impactOccurred('medium');
        }

        document.getElementById('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

        function applyPromo() {
            const input = document.getElementById('promo-input');
            const code = input.value.trim().toUpperCase();
            const discountInfo = document.getElementById('discount-info');
            
            if (promoCodes[code]) {
                activeDiscount = promoCodes[code];
                activePromoCode = code;
                discountInfo.innerText = `Скидка ${activeDiscount * 100}%`;
                updateCartUI();
                input.value = '';
                if (tg) tg.HapticFeedback.notificationOccurred('success');
            } else {
                activeDiscount = 0; activePromoCode = ''; discountInfo.innerText = '';
                updateCartUI();
                alert('❌ Неверный промокод');
            }
        }

        function updateCartUI() {
            let total = 0; let count = 0;
            for (const id in cart) {
                const product = products.find(p => p.id == id);
                if (product) { total += product.price * cart[id]; count += cart[id]; }
            }
            
            let finalTotal = total;
            if (activeDiscount > 0) finalTotal = Math.round(total * (1 - activeDiscount));
            document.getElementById('cart-total').innerText = `${finalTotal} ₽`;
        }

        function checkout() {
            if (Object.keys(cart).length === 0) { alert("Корзина пуста! Добавьте товары."); return; }
            
            let itemsList = [];
            let total = 0;
            for (const id in cart) {
                const product = products.find(p => p.id == id);
                if (product) {
                    total += product.price * cart[id];
                    itemsList.push(`${product.title} (${cart[id]} шт.) - ${product.price * cart[id]} ₽`);
                }
            }
            let finalTotal = activeDiscount > 0 ? Math.round(total * (1 - activeDiscount)) : total;

            const orderData = {
                action: 'checkout',
                items: itemsList,
                total: finalTotal,
                promo: activePromoCode || 'Нет'
            };

            if (tg) { 
                tg.sendData(JSON.stringify(orderData)); 
                tg.close(); 
            } else { 
                alert("Заказ сформирован для админа:\n" + JSON.stringify(orderData, null, 2)); 
            }
        }

        renderProducts();
    </script>
</body>
</html>
