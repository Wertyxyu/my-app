<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Mini App</title>
    <!-- 1. Подключаем скрипт Telegram. Это ОБЯЗАТЕЛЬНО -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        h1 { color: var(--tg-theme-button-color, #2481cc); }
    </style>
</head>
<body>
    <h1>Привет!</h1>
    <p id="user-name">Загрузка данных...</p>

    <script>
        // 2. Инициализируем приложение
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем Telegram, что мы готовы
        tg.expand(); // Разворачиваем на весь экран

        // 3. Получаем данные пользователя (для отображения)
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `Ты: ${user.first_name} (@${user.username})`;
        } else {
            document.getElementById('user-name').innerText = 'Данные пользователя не получены (открой через Telegram)';
        }
    </script>
</body>
</html>
